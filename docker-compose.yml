# Un solo comando levanta todo el sistema: docker compose up -d --build
# "name" fija el nombre del proyecto: así Jenkins y tu terminal manejan los mismos contenedores
name: geolife

# ---- Plantillas reutilizables (anclas YAML): evitan repetir la misma configuración ----
# Imagen de Python que usan Dask, la API, la ingesta y las pruebas (docker/app.Dockerfile).
# Todas comparten el volumen "datos" para ver los mismos archivos (dataset y Parquet limpio).
x-app: &app
  build:
    context: .
    dockerfile: docker/app.Dockerfile
  image: geolife-app:latest
  environment:
    MONGO_URI: mongodb://mongo:27017
    MONGO_DB: geolife
    DASK_SCHEDULER: tcp://dask-scheduler:8786
    DATOS_DIR: /data
  volumes:
    - datos:/data

# Imagen de Spark con el MongoDB Spark Connector ya instalado (docker/spark.Dockerfile)
x-spark: &spark
  build:
    context: .
    dockerfile: docker/spark.Dockerfile
  image: geolife-spark:latest
  user: root
  volumes:
    - datos:/data

services:
  # Base de datos: guarda los puntos como GeoJSON con índice 2dsphere.
  # El healthcheck permite que los demás servicios esperen a que Mongo responda de verdad.
  # El límite de memoria y la caché de WiredTiger evitan que Mongo se coma la RAM del equipo.
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes:
      - mongo_datos:/data/db
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: {memory: 1200m}

  # Dask: el scheduler reparte tareas (dashboard en el puerto 8787) y 2 workers las ejecutan
  dask-scheduler:
    <<: *app
    command: ["dask", "scheduler", "--port", "8786", "--dashboard-address", ":8787"]
    ports: ["8787:8787"]

  dask-worker:
    <<: *app
    command: ["dask", "worker", "tcp://dask-scheduler:8786", "--nthreads", "1", "--memory-limit", "1GB"]
    depends_on: [dask-scheduler]
    deploy:
      replicas: 2  # "al menos dos workers" que pide el taller

  # Spark: un nodo maestro (interfaz web en el 8081) y 2 workers de 1 núcleo y 800 MB
  spark-master:
    <<: *spark
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports: ["8081:8080"]
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: geolife

  spark-worker:
    <<: *spark
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077",
              "--cores", "1", "--memory", "800m"]
    depends_on: [spark-master]
    deploy:
      replicas: 2

  # API Flask (gunicorn, definido en el Dockerfile). Solo arranca cuando Mongo está sano.
  # Su healthcheck llama a /health: así "docker compose up --wait" sabe cuándo ya responde.
  api:
    <<: *app
    ports: ["5000:5000"]
    depends_on:
      mongo: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  # job de una sola vez: descarga de kaggle + limpieza con dask + carga a mongo
  # "profiles" lo deja fuera del arranque normal: solo corre con --profile jobs
  ingesta:
    <<: *app
    command: ["python", "-m", "app.ingesta"]
    profiles: ["jobs"]
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: geolife
      DASK_SCHEDULER: tcp://dask-scheduler:8786
      DATOS_DIR: /data
      OBJETIVO_REGISTROS: ${OBJETIVO_REGISTROS:-2000000}
      # Credenciales de Kaggle opcionales: vienen del .env o de Jenkins, nunca del repositorio
      KAGGLE_USERNAME: ${KAGGLE_USERNAME:-}
      KAGGLE_KEY: ${KAGGLE_KEY:-}
    depends_on:
      mongo: {condition: service_healthy}
      dask-worker: {condition: service_started}

  # pruebas de humo contra la api (las usa jenkins)
  # También quedan fuera del arranque normal (profile "tests"); esperan a que la API esté sana
  pruebas-api:
    <<: *app
    command: ["pytest", "tests/smoke", "-v"]
    profiles: ["tests"]
    environment:
      API_URL: http://api:5000
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: geolife
    depends_on:
      api: {condition: service_healthy}

  # Jenkins con imagen propia (docker/jenkins). Se monta el socket de Docker del equipo para
  # que Jenkins pueda construir y levantar contenedores. jenkins_home conserva su configuración.
  # OJO: si no existe el archivo .env la contraseña de admin cae al valor "admin": no exponerlo así a internet.
  jenkins:
    build:
      context: docker/jenkins
    image: geolife-jenkins:latest
    user: root
    ports: ["8080:8080", "50000:50000"]
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-admin}
      REPO_URL: ${REPO_URL:-https://github.com/USUARIO/geolife-geoespacial.git}
      KAGGLE_USERNAME: ${KAGGLE_USERNAME:-}
      KAGGLE_KEY: ${KAGGLE_KEY:-}
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

# Volúmenes con nombre: los datos sobreviven aunque se apaguen o recreen los contenedores
volumes:
  datos:
  mongo_datos:
  jenkins_home:
